<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada | Clínica Odontológica Girald-Dent</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .error-container {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      color: #0284c7;
      margin: 0;
      line-height: 1;
    }
    .error-title {
      font-size: 1.8rem;
      color: #1e293b;
      margin: 1rem 0;
    }
    .error-description {
      color: #64748b;
      max-width: 500px;
      margin-bottom: 2rem;
    }
    .btn-home {
      display: inline-block;
      background-color: #0284c7;
      color: #ffffff;
      padding: 0.8rem 1.8rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }
    .btn-home:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <main class="error-container">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">¡Ups! Página no encontrada</h2>
    <p class="error-description">
      La página que buscas no existe o ha sido movida. Puedes volver al inicio de **Girald-Dent** para explorar nuestros servicios odontológicos.
    </p>
    <a href="index.html" class="btn-home">Volver al Inicio</a>
  </main>

</body>
</html>
